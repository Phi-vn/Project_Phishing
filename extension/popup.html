<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      overflow-x: hidden;
    }
    .circle-progress {
      transition: stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .safe-pulse::before {
      content: '';
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      border-radius: 50%;
      border: 3px solid #10b981;
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .danger-pulse::before {
      content: '';
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      border-radius: 50%;
      border: 3px solid #ef4444;
      animation: pulse-ring 1s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 transition-colors duration-500" id="body">

  <div class="relative p-5">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30" id="logo-icon">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <div>
          <h1 class="text-base font-extrabold text-slate-900 leading-tight tracking-tight">PhishArmor AI</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75" id="status-ping"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500" id="status-dot"></span>
            </span>
            <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest" id="system-status">System Active</span>
          </div>
        </div>
      </div>
      <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-200/50 rounded-xl transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </div>

    <!-- Score Circle -->
    <div class="flex justify-center mb-8 relative">
      <div class="relative w-36 h-36 flex items-center justify-center" id="score-wrapper">
        <svg class="w-full h-full transform -rotate-90 absolute" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"></circle>
          <circle cx="50" cy="50" r="45" fill="none" stroke="#10b981" stroke-width="7" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round" class="circle-progress drop-shadow-md" id="score-circle"></circle>
        </svg>
        <div class="text-center z-10">
          <div class="text-[40px] font-black text-slate-900 tracking-tighter leading-none" id="trust-score">--</div>
          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Trust Score</div>
        </div>
      </div>
    </div>

    <!-- URL Info -->
    <div class="bg-white rounded-[20px] p-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100/80 mb-5 relative overflow-hidden group">
      <div class="absolute top-0 left-0 w-1.5 h-full bg-emerald-400" id="url-indicator"></div>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-2">Tên miền hiện tại</p>
      <div class="flex items-center justify-between ml-2">
        <div class="text-[13px] font-bold text-slate-800 truncate pr-3 w-48" id="current-url">...</div>
        <div class="flex-shrink-0 px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-lg text-[10px] font-bold flex items-center gap-1" id="ssl-status">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"></path></svg>
          SSL
        </div>
      </div>
    </div>

    <!-- AI Explainability (XAI) -->
    <div class="bg-white rounded-[20px] p-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100/80 mb-6" id="xai-box">
      <div class="flex items-center gap-2 mb-2.5">
        <div class="w-6 h-6 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Phân tích bằng SHAP AI</span>
      </div>
      <p class="text-[13px] text-slate-600 font-medium leading-relaxed" id="message">Đang nạp trọng số mô hình Học sâu...</p>
    </div>

    <!-- Action -->
    <button id="btn-check" class="w-full py-4 bg-slate-900 text-white rounded-[16px] text-[13px] font-bold shadow-xl shadow-slate-900/20 hover:bg-slate-800 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
      <svg class="w-4 h-4 animate-spin hidden" id="btn-spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      <span id="btn-text">Quét mã độc</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

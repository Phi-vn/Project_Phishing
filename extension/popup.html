<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #334155;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo {
      background: #0ea5e9;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .title-group {
      flex: 1;
    }
    .title-group h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }
    .status {
      font-size: 12px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      margin-top: 2px;
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
    }
    
    .score-container {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }
    .circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 8px solid #e2e8f0;
      border-top-color: #10b981;
      border-right-color: #10b981;
      border-bottom-color: #10b981;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.5s;
    }
    .score-value {
      font-size: 36px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1;
    }
    .score-label {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      font-weight: 500;
    }
    .message {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
      min-height: 38px;
    }
    
    .url-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .url-text {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
    .ssl-badge {
      background: #dcfce7;
      color: #166534;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .metrics {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric {
      font-size: 13px;
    }
    .metric-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .metric-title { color: #64748b; font-weight: 500; }
    .metric-value { font-weight: 600; color: #0f172a; }
    .progress-bg {
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #10b981;
      width: 0%;
      transition: width 0.5s;
    }
    
    .btn-scan {
      width: 100%;
      background: #0f172a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-scan:hover { background: #334155; }
    .btn-scan:disabled { background: #cbd5e1; cursor: not-allowed; }
    
    /* Warning/Phishing State */
    body.danger .circle { 
      border-color: #fca5a5;
      border-top-color: #ef4444; 
      border-right-color: #ef4444; 
      border-bottom-color: #ef4444; 
    }
    body.danger .score-value { color: #ef4444; }
    body.danger .progress-bar { background: #ef4444; }
    body.danger .status { color: #ef4444; }
    body.danger .status::before { background: #ef4444; }
    body.danger .ssl-badge { background: #fee2e2; color: #991b1b; }
    body.danger .btn-scan { background: #ef4444; }
    body.danger .btn-scan:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">🛡️</div>
      <div class="title-group">
        <h1>PhishArmor AI</h1>
        <div class="status" id="system-status">Đang khởi động...</div>
      </div>
    </div>
    
    <div class="score-container">
      <div class="circle" id="score-circle">
        <div class="score-value" id="trust-score">--%</div>
        <div class="score-label">Trust Score</div>
      </div>
    </div>
    
    <div class="message" id="message">Hệ thống đang quét URL hiện tại...</div>
    
    <div class="url-box">
      <div class="url-text" id="current-url">...</div>
      <div class="ssl-badge" id="ssl-status">🔍 Kiểm tra...</div>
    </div>
    
    <div class="metrics">
      <div class="metric">
        <div class="metric-header">
          <span class="metric-title">URL Pattern</span>
          <span class="metric-value" id="metric-url">--</span>
        </div>
        <div class="progress-bg"><div class="progress-bar" id="bar-url"></div></div>
      </div>
      <div class="metric">
        <div class="metric-header">
          <span class="metric-title">Trùng lặp thương hiệu</span>
          <span class="metric-value" id="metric-brand">--</span>
        </div>
        <div class="progress-bg"><div class="progress-bar" id="bar-brand"></div></div>
      </div>
      <div class="metric">
        <div class="metric-header">
          <span class="metric-title">Tính toàn vẹn nội dung</span>
          <span class="metric-value" id="metric-content">--</span>
        </div>
        <div class="progress-bg"><div class="progress-bar" id="bar-content"></div></div>
      </div>
    </div>
    
    <button class="btn-scan" id="btn-check">Đang phân tích...</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>

databases:
  - name: phisharmor-db
    plan: free
    databaseName: phisharmor
    user: phisharmor

services:
  - type: web
    name: phisharmor-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PHISHARMOR_CLOUD_MODE
        value: "1"
      - key: ADMIN_PORTAL_KEY
        value: "phisharmor2026"
      - key: DATABASE_URL
        fromDatabase:
          name: phisharmor-db
          property: connectionString
